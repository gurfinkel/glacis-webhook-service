services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=project.settings.prod
      - TEMPORAL_ADDRESS=temporal:7233
      - POSTGRES_URL=postgres://postgres:postgres@postgres:5432/glacis
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=*
    depends_on:
      redis:
        condition: service_started
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Migrate on boot. In production this would be a separate Job in K8s
    # rather than each replica racing on `migrate`, but for the dev compose
    # it's the simplest path to a working stack.
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn project.wsgi:application -c project/gunicorn_conf.py"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=project.settings.prod
      - TEMPORAL_ADDRESS=temporal:7233
      - POSTGRES_URL=postgres://postgres:postgres@postgres:5432/glacis
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=*
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  temporal:
    image: temporalio/temporal:1.25
    command: server start-dev --ip 0.0.0.0 --port 7233 --ui-port 8233 --log-level warn
    # Bind only to host loopback. The dev server has no auth — exposing
    # 7233/8233 on a non-laptop host gives anyone on the network a workflow
    # execution surface. Containers on the compose network reach
    # `temporal:7233` over the internal bridge; this just blocks host-network
    # access from outside localhost.
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address localhost:7233 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=glacis
    healthcheck:
      test: pg_isready -U postgres
      interval: 3s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
